<!-- STATUS CHECK BOX -->
<div class="status-box">
  <h3>Status Check</h3>
  <p>Apna 13 digit CNIC number likhen</p>
  <input type="text" id="cnicInput" maxlength="13" placeholder="Sirf 13 number likhen">
  <button onclick="checkStatus()">Search</button>
  <p id="result" style="margin-top:15px; font-weight:bold;"></p>
</div>
<script>
function checkStatus() {
  let cnic = document.getElementById("cnicInput").value;
  let result = document.getElementById("result");
  if(cnic.length === 13 && !isNaN(cnic)) {
    result.style.color = "green";
    result.innerText = "Data mil gaya! Filhal koi update nahi hai.";
  } else {
    result.style.color = "red";
    result.innerText = "Error: Sirf 13 number likhen.";
  }
}
</script>
